apiVersion: kubefacet.steeltanuki.it/v1alpha1
kind: Facet
metadata:
  name: typed
  namespace: kubefacet-example-typed
  labels: {kubefacet.steeltanuki.it/example: typed-extraction}
spec:
  sources:
    - id: deployment
      resource: {apiVersion: apps/v1, kind: Deployment}
      namespaces: {names: [kubefacet-example-typed]}
      selector: {name: typed}
      fields:
        - {name: createdAt, path: "{.metadata.creationTimestamp}", type: timestamp}
