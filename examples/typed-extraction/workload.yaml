apiVersion: apps/v1
kind: Deployment
metadata:
  name: typed
  namespace: kubefacet-example-typed
  labels:
    kubefacet.steeltanuki.it/example: typed-extraction
    app.kubernetes.io/name: kubefacet-example-typed
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: kubefacet-example-typed}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubefacet-example-typed
        kubefacet.steeltanuki.it/example: typed-extraction
    spec:
      containers: [{name: fixture, image: registry.k8s.io/pause:3.10, imagePullPolicy: IfNotPresent}]
