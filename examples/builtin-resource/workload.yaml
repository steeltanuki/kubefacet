apiVersion: apps/v1
kind: Deployment
metadata:
  name: builtin
  namespace: kubefacet-example-builtin
  labels:
    kubefacet.steeltanuki.it/example: builtin-resource
    app.kubernetes.io/name: kubefacet-example-builtin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubefacet-example-builtin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubefacet-example-builtin
        kubefacet.steeltanuki.it/example: builtin-resource
    spec:
      containers:
        - name: fixture
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
