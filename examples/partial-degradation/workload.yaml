apiVersion: apps/v1
kind: Deployment
metadata:
  name: degraded
  namespace: kubefacet-example-degraded
  labels: {kubefacet.steeltanuki.it/example: partial-degradation, app.kubernetes.io/name: degraded}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: degraded}}
  template:
    metadata: {labels: {app.kubernetes.io/name: degraded, kubefacet.steeltanuki.it/example: partial-degradation}}
    spec: {containers: [{name: fixture, image: registry.k8s.io/pause:3.10, imagePullPolicy: IfNotPresent}]}
---
apiVersion: fixtures.kubefacet.steeltanuki.it/v1alpha1
kind: DegradedWidget
metadata:
  name: degraded-widget
  namespace: kubefacet-example-degraded
  labels: {kubefacet.steeltanuki.it/example: partial-degradation}
spec: {size: 3}
