apiVersion: kubefacet.steeltanuki.it/v1alpha1
kind: Facet
metadata:
  name: operator
  namespace: kubefacet-example-operator
  labels: {kubefacet.steeltanuki.it/example: value-operator}
spec:
  sources:
    - id: deployment
      resource: {apiVersion: apps/v1, kind: Deployment}
      namespaces: {names: [kubefacet-example-operator]}
      selector: {name: operator}
      fields:
        - name: replicas
          path: "{.spec.replicas}"
          type: integer
          operators:
            - operator: gte
              value: {state: value, integerValue: 1}
