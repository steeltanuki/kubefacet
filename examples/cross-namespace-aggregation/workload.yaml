apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregation-a
  namespace: kubefacet-example-aggregation-a
  labels: {kubefacet.steeltanuki.it/example: cross-namespace-aggregation, app.kubernetes.io/name: aggregation-a}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: aggregation-a}}
  template:
    metadata: {labels: {app.kubernetes.io/name: aggregation-a, kubefacet.steeltanuki.it/example: cross-namespace-aggregation}}
    spec: {containers: [{name: fixture, image: registry.k8s.io/pause:3.10, imagePullPolicy: IfNotPresent}]}
---
