  template:
    metadata: {labels: {app.kubernetes.io/name: aggregation-b, kubefacet.steeltanuki.it/example: cross-namespace-aggregation}}
    spec: {containers: [{name: fixture, image: registry.k8s.io/pause:3.10, imagePullPolicy: IfNotPresent}]}
