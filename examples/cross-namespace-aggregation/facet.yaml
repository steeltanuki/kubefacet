apiVersion: kubefacet.steeltanuki.it/v1alpha1
kind: Facet
metadata:
  name: aggregation
  namespace: kubefacet-example-aggregation-a
  labels: {kubefacet.steeltanuki.it/example: cross-namespace-aggregation}
spec:
  sources:
    - id: deployments
      resource: {apiVersion: apps/v1, kind: Deployment}
      namespaces: {names: [kubefacet-example-aggregation-a, kubefacet-example-aggregation-b]}
      fields: [{name: replicas, path: "{.spec.replicas}", type: integer}]
      aggregations:
        - {name: total, function: sum, field: replicas}
