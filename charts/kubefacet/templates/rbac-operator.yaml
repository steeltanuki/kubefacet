{{- if and (gt (len .Values.rbac.observed.clusterScoped) 0) (not .Values.accessPolicy.allowClusterScoped) }}
{{- fail "rbac.observed.clusterScoped requires accessPolicy.allowClusterScoped=true" }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubefacet.fullname" . }}-operator
  labels:
    {{- include "kubefacet.labels" . | nindent 4 }}
  annotations:
    {{- include "kubefacet.ownershipAnnotations" . | nindent 4 }}
rules:
  - apiGroups: ["kubefacet.steeltanuki.it"]
    resources: ["facets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kubefacet.steeltanuki.it"]
    resources: ["facets/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["kubefacet.steeltanuki.it"]
    resources: ["facetaccesspolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubefacet.fullname" . }}-operator
  labels:
    {{- include "kubefacet.labels" . | nindent 4 }}
  annotations:
    {{- include "kubefacet.ownershipAnnotations" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubefacet.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "kubefacet.serviceAccountName" . }}
    namespace: {{ include "kubefacet.namespace" . }}
