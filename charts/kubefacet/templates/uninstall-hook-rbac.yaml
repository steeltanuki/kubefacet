{{- $labels := include "kubefacet.labels" . -}}
{{- $ownership := include "kubefacet.ownershipAnnotations" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubefacet.fullname" . }}-pre-delete-hook
  namespace: {{ include "kubefacet.namespace" . }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    {{- $ownership | nindent 4 }}
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubefacet.fullname" . }}-pre-delete-hook
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    {{- $ownership | nindent 4 }}
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubefacet.fullname" . }}-pre-delete-hook
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    {{- $ownership | nindent 4 }}
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubefacet.fullname" . }}-pre-delete-hook
subjects:
  - kind: ServiceAccount
    name: {{ include "kubefacet.fullname" . }}-pre-delete-hook
    namespace: {{ include "kubefacet.namespace" . }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubefacet.fullname" . }}-post-delete-hook
  namespace: {{ include "kubefacet.namespace" . }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    {{- $ownership | nindent 4 }}
    helm.sh/hook: post-delete
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubefacet.fullname" . }}-post-delete-hook
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    {{- $ownership | nindent 4 }}
    helm.sh/hook: post-delete
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get"]
  - apiGroups: ["kubefacet.steeltanuki.it"]
    resources: ["facetaccesspolicies"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubefacet.fullname" . }}-post-delete-hook
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    {{- $ownership | nindent 4 }}
    helm.sh/hook: post-delete
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubefacet.fullname" . }}-post-delete-hook
subjects:
  - kind: ServiceAccount
    name: {{ include "kubefacet.fullname" . }}-post-delete-hook
    namespace: {{ include "kubefacet.namespace" . }}
