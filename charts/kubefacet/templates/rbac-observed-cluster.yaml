{{- if gt (len .Values.rbac.observed.clusterScoped) 0 }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubefacet.fullname" . }}-observed-cluster
  labels:
    {{- include "kubefacet.labels" . | nindent 4 }}
  annotations:
    {{- include "kubefacet.ownershipAnnotations" . | nindent 4 }}
rules:
{{- range $rule := .Values.rbac.observed.clusterScoped }}
  - apiGroups:
      {{- toYaml $rule.apiGroups | nindent 6 }}
    resources:
      {{- toYaml $rule.resources | nindent 6 }}
    verbs:
      {{- toYaml $rule.verbs | nindent 6 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubefacet.fullname" . }}-observed-cluster
  labels:
    {{- include "kubefacet.labels" . | nindent 4 }}
  annotations:
    {{- include "kubefacet.ownershipAnnotations" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubefacet.fullname" . }}-observed-cluster
subjects:
  - kind: ServiceAccount
    name: {{ include "kubefacet.serviceAccountName" . }}
    namespace: {{ include "kubefacet.namespace" . }}
{{- end }}
