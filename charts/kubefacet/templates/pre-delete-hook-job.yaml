apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kubefacet.fullname" . }}-pre-delete
  namespace: {{ include "kubefacet.namespace" . }}
  labels:
    {{- include "kubefacet.labels" . | nindent 4 }}
  annotations:
    {{- include "kubefacet.ownershipAnnotations" . | nindent 4 }}
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        {{- include "kubefacet.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kubefacet.fullname" . }}-pre-delete-hook
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pre-delete
          image: {{ include "kubefacet.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/kubefacet"]
          args:
            - package
            - pre-delete
            - --release-name={{ .Release.Name }}
            - --release-namespace={{ .Release.Namespace }}
            - --timeout=90s
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
