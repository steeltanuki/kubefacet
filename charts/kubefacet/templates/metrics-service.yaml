{{- if .Values.metrics.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubefacet.metricsServiceName" . }}
  namespace: {{ include "kubefacet.namespace" . }}
  labels:
    {{- include "kubefacet.labels" . | nindent 4 }}
  annotations:
    {{- include "kubefacet.ownershipAnnotations" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kubefacet.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.service.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}
